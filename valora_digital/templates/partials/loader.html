<div class="loader" id="loader" aria-label="Loading {{ site.name }}">
  <div class="loader-wine" id="loaderWine"></div>
  <div class="loader-grain"></div>
  <div class="loader-center" id="loaderCenter">
    <svg class="loader-symbol" viewBox="0 0 405 429" aria-hidden="true">
      <path id="loaderPath" d="{{ logo_path }}"/>
    </svg>
    <div class="loader-name"><strong>VALORA</strong><span>Digital</span></div>
    <div class="loader-tag">Media &amp; Marketing Agency</div>
  </div>
  <div class="loader-bottom">
    <span class="loader-count" id="loaderCount">000</span>
    <button class="skip" id="skipIntro" type="button">Skip intro ↗</button>
    <span class="loader-count">MEDIA &amp; MARKETING AGENCY</span>
  </div>
</div>
